<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إدارة الموقع</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #0f172a; padding: 20px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h1 { text-align: center; margin-bottom: 30px; color: #1d4ed8; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit; font-size: 1rem; box-sizing: border-box; }
    button { width: 100%; padding: 15px; background: #1d4ed8; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1e3a8a; }
    .status { text-align: center; margin-top: 20px; font-weight: 700; }
    .status.success { color: #16a34a; }
    .status.error { color: #dc2626; }
  </style>
</head>
<body>

  <div class="container">
    <h1>لوحة التحكم - إضافة محتوى جديد</h1>
    
    <form id="addForm">
      <div class="form-group">
        <label>عنوان الملف (مثال: ملزمة الرياضيات السادس العلمي)</label>
        <input type="text" id="title" required>
      </div>

      <div class="form-group">
        <label>الوصف</label>
        <textarea id="description" rows="3" required></textarea>
      </div>

      <div class="form-group">
        <label>نوع الملف</label>
        <select id="type">
          <option value="pdf">ملف PDF</option>
          <option value="video">فيديو</option>
          <option value="image">صورة</option>
        </select>
      </div>

      <div class="form-group">
        <label>المرحلة الدراسية</label>
        <select id="stage">
          <option value="ابتدائي">ابتدائي</option>
          <option value="متوسط">متوسط</option>
          <option value="إعدادي">إعدادي</option>
        </select>
      </div>

      <div class="form-group">
        <label>رابط الملف (من Google Drive أو يوتيوب)</label>
        <input type="url" id="url" placeholder="https://..." required>
      </div>

      <button type="submit">إضافة الملف إلى الموقع</button>
    </form>

    <div id="status" class="status"></div>
  </div>

  <!-- ربط Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // *** ضع مفاتيح Firebase الخاصة بك هنا ***
    const firebaseConfig = {
      apiKey: "AIzaSyAxYL9sctGcI8iw7AnN5no4ymhEdgnlGXg",
      authDomain: "rander-edu.firebaseapp.com",
      projectId: "rander-edu",
      storageBucket: "rander-edu.firebasestorage.app",
      messagingSenderId: "1073803009753",
      appId: "1:1073803009753:web:d92d65657d8af57f36a8c8",
      measurementId: "G-9ZGK9LTC87"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('addForm');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusDiv.textContent = "جاري الإضافة...";
      statusDiv.className = "status";

      const newFile = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        type: document.getElementById('type').value,
        stage: document.getElementById('stage').value,
        url: document.getElementById('url').value,
        date: new Date().toISOString()
      };

      try {
        await addDoc(collection(db, "files"), newFile);
        statusDiv.textContent = "تمت إضافة الملف بنجاح! سيظهر في الموقع قريباً.";
        statusDiv.className = "status success";
        form.reset();
      } catch (error) {
        console.error("Error adding document: ", error);
        statusDiv.textContent = "حدث خطأ: " + error.message;
        statusDiv.className = "status error";
      }
    });
  </script>
</body>
</html>
