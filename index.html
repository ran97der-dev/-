<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنصة التعليمية العراقية | كل ما تحتاجه للدراسة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    [data-theme="dark"] {
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; line-height: 1.6; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    /* Header */
    header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
    .header-content { display: flex; justify-content: space-between; align-items: center; height: 72px; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: 800; color: var(--primary); text-decoration: none; }
    .nav-actions { display: flex; align-items: center; gap: 15px; }
    .icon-btn { background: none; border: none; color: var(--text); cursor: pointer; padding: 8px; border-radius: 50%; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: var(--border); }

    /* Hero & Search */
    .hero { background: linear-gradient(135deg, var(--primary), #1e3a8a); color: white; padding: 60px 0; text-align: center; }
    .hero h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; }
    .hero p { font-size: 1.1rem; opacity: 0.9; margin-bottom: 30px; }
    .search-bar { position: relative; max-width: 600px; margin: 0 auto; }
    .search-bar input { width: 100%; padding: 16px 50px 16px 20px; border: none; border-radius: 50px; font-size: 1.1rem; outline: none; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .search-bar i { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--muted); }

    /* Filters */
    .filters { display: flex; gap: 10px; overflow-x: auto; padding: 20px 0; scrollbar-width: none; }
    .filter-btn { background: var(--surface); border: 1px solid var(--border); padding: 8px 20px; border-radius: 50px; cursor: pointer; color: var(--text); font-weight: 600; white-space: nowrap; transition: all 0.2s; }
    .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Grid & Cards */
    .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; padding-bottom: 60px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; padding: 4px 12px; border-radius: 50px; }
    .badge.pdf { background: #fee2e2; color: #b91c1c; }
    .badge.video { background: #dbeafe; color: #1d4ed8; }
    .badge.image { background: #dcfce7; color: #15803d; }
    .card h3 { font-size: 1.1rem; font-weight: 700; margin-top: 5px; }
    .card p { color: var(--muted); font-size: 0.9rem; flex-grow: 1; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 700; transition: background 0.2s; border: none; cursor: pointer; width: 100%; }
    .btn:hover { background: var(--primary-hover); }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; padding: 30px; position: relative; }
    .close-modal { position: absolute; top: 15px; left: 15px; background: none; border: none; color: var(--muted); cursor: pointer; padding: 5px; }
    .modal iframe { width: 100%; height: 400px; border-radius: 12px; margin-top: 20px; border: none; }
    .modal img { width: 100%; border-radius: 12px; margin-top: 20px; }

    @media (max-width: 768px) {
      .hero h1 { font-size: 1.6rem; }
      .files-grid { grid-template-columns: 1fr; }
      .modal iframe { height: 250px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container header-content">
      <a href="#" class="logo">
        <i data-lucide="graduation-cap" style="width: 32px; height: 32px;"></i>
        المنصة التعليمية
      </a>
      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" title="تغيير المظهر">
          <i data-lucide="moon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <h1>أضخم منصة تعليمية للطلاب العراقيين</h1>
      <p>ملازم، ملخصات، أسئلة وزارية، وفيديوهات شرح لجميع المراحل.</p>
      <div class="search-bar">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" placeholder="ابحث عن ملزمة، مادة، أو سؤال وزاري...">
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="container">
    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">الكل</button>
      <button class="filter-btn" data-filter="ابتدائي">المرحلة الابتدائية</button>
      <button class="filter-btn" data-filter="متوسط">المرحلة المتوسطة</button>
      <button class="filter-btn" data-filter="إعدادي">المرحلة الإعدادية</button>
    </div>

    <!-- Files Grid -->
    <div class="files-grid" id="filesGrid">
      <!-- سيتم توليد البطاقات هنا بواسطة JavaScript -->
    </div>
  </main>

  <!-- Modal (نافذة العرض) -->
  <div class="modal-overlay" id="fileModal">
    <div class="modal">
      <button class="close-modal" id="closeModal"><i data-lucide="x" style="width: 28px; height: 28px;"></i></button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- استدعاء مكتبة الأيقونات وتشغيلها -->
  <script>lucide.createIcons();</script>
  <!-- استدعاء قاعدة البيانات -->
  <script src="data.js"></script>

  <script>
    // --- إعدادات الوضع الليلي ---
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    
    // التحقق من الوضع المحفوظ
    if (localStorage.getItem('theme') === 'dark') {
      html.setAttribute('data-theme', 'dark');
      themeToggle.innerHTML = '<i data-lucide="sun"></i>';
      lucide.createIcons();
    }

    themeToggle.addEventListener('click', () => {
      if (html.getAttribute('data-theme') === 'dark') {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeToggle.innerHTML = '<i data-lucide="moon"></i>';
      } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeToggle.innerHTML = '<i data-lucide="sun"></i>';
      }
      lucide.createIcons();
    });

    // --- عرض الملفات ---
    const grid = document.getElementById('filesGrid');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');
    let currentFilter = 'all';
    let currentSearch = '';

    function renderFiles() {
      grid.innerHTML = '';
      
      const filtered = siteData.files.filter(file => {
        const matchFilter = currentFilter === 'all' || file.stage === currentFilter;
        const matchSearch = file.title.includes(currentSearch) || file.subject.includes(currentSearch);
        return matchFilter && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; padding: 40px; color:var(--muted)">لا توجد نتائج مطابقة لبحثك.</p>';
        return;
      }

      filtered.forEach(file => {
        let icon = 'file-text';
        let badgeClass = 'pdf';
        let btnText = 'تحميل الملف';
        
        if (file.type === 'video') { icon = 'video'; badgeClass = 'video'; btnText = 'مشاهدة الفيديو'; }
        if (file.type === 'image') { icon = 'image'; badgeClass = 'image'; btnText = 'عرض الصورة'; }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="badge ${badgeClass}"><i data-lucide="${icon}" style="width:14px;height:14px;"></i> ${file.type.toUpperCase()}</span>
            <span style="font-size:0.8rem; color:var(--muted)">${file.stage}</span>
          </div>
          <h3>${file.title}</h3>
          <p>${file.description}</p>
          <button class="btn" onclick="openModal(${file.id})">
            <i data-lucide="download" style="width:18px;height:18px;"></i> ${btnText}
          </button>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    // --- نظام البحث والفلترة ---
    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value.trim();
      renderFiles();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderFiles();
      });
    });

    // --- النافذة المنبثقة (Modal) ---
    const modal = document.getElementById('fileModal');
    const modalContent = document.getElementById('modalContent');
    const closeModal = document.getElementById('closeModal');

    window.openModal = function(id) {
      const file = siteData.files.find(f => f.id === id);
      if (!file) return;

      let contentHTML = `<h2 style="margin-bottom: 10px;">${file.title}</h2><p style="color:var(--muted); margin-bottom:20px;">${file.description}</p>`;

      if (file.type === 'video') {
        contentHTML += `<iframe src="${file.url}" allowfullscreen></iframe>`;
      } else if (file.type === 'image') {
        contentHTML += `<img src="${file.url}" alt="${file.title}">`;
      } else {
        contentHTML += `<a href="${file.url}" target="_blank" class="btn" style="max-width:300px; margin:0 auto;">تحميل الملف الآن</a>`;
      }

      modalContent.innerHTML = contentHTML;
      modal.style.display = 'flex';
    }

    closeModal.addEventListener('click', () => {
      modal.style.display = 'none';
      modalContent.innerHTML = ''; // إيقاف الفيديو عند الإغلاق
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
        modalContent.innerHTML = '';
      }
    });

    // --- التشغيل الأولي ---
    renderFiles();
  </script>
</body>
</html>
